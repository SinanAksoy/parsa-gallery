<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121b1b" />
  <meta name="description" content="Parsa's Gallery" />
  <title>Parsa's Gallery</title>
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="toast" aria-live="polite" role="status"></div>
  <script>
  // Try both documented UMD CDNs. Delaying startup avoids a race on slow connections.
  window.parsaSupabaseReady = new Promise((resolve, reject) => {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
      'https://unpkg.com/@supabase/supabase-js@2'
    ];
    let index = 0;
    function next() {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        resolve();
        return;
      }
      if (index >= urls.length) {
        reject(new Error('Supabase JavaScript library could not load from either CDN. Check your network or content blockers.'));
        return;
      }
      const script = document.createElement('script');
      script.src = urls[index++];
      script.crossOrigin = 'anonymous';
      let completed = false;
      const timeout = setTimeout(() => {
        if (completed) return;
        completed = true;
        script.remove();
        next();
      }, 12000);
      function done() {
        if (completed) return;
        completed = true;
        clearTimeout(timeout);
        next();
      }
      script.onload = done;
      script.onerror = done;
      document.head.appendChild(script);
    }
    next();
  });
</script>
  <script src="config.js" defer></script>
  <script src="cloud.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
